name: CI/CD Pipeline with Git Flow and SonarQube

on:
  push:
    branches:
      - main
      - release/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - feature/*

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      -   name: Cache SonarQube Cloud packages
          uses: actions/cache@v4
          with:
              path: ~/.sonar/cache
              key: ${{ runner.os }}-sonar
              restore-keys: ${{ runner.os }}-sonar
      -   name: Cache Maven packages
          uses: actions/cache@v4
          with:
              path: ~/.m2
              key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
              restore-keys: ${{ runner.os }}-m2
      - name: Build and Analyze with SonarQube
        run: mvn clean verify sonar:sonar -Dsonar.organization=mayconaraujosantos \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy-to-dev:
    needs: build-and-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/*'
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Deploy to Dev
        run: mvn deploy -Dspring.profiles.active=dev

  deploy-to-prod:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/*'
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Deploy to Prod
        run: mvn deploy -Dspring.profiles.active=prod
