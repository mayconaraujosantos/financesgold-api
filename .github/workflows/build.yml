name: CI/CD Pipeline with Git Flow and SonarQube

on:
  push:
    branches:
      - main
      - release/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - feature/*

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and Analyze with SonarQube
        uses: sonarsource/sonar-scanner-action@latest
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-to-dev:
    needs: build-and-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/*'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Deploy to Dev
        run: mvn deploy -Dspring.profiles.active=dev

  deploy-to-prod:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/*'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Deploy to Prod
        run: mvn deploy -Dspring.profiles.active=prod
